<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario físico | Home Office by Canella</title>

    <!-- Librería para leer archivos Excel directamente en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F4F6F8;
            color: #25282B;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }


        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 22px;
            margin-bottom: 18px;
            background: white;
            border: 1px solid #DCE2E7;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(37,40,43,0.06);
            position: relative;
            overflow: hidden;
        }

        .brand-header::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: #00A3E2;
        }

        .brand-logo {
            width: 270px;
            max-width: 48%;
            height: auto;
            display: block;
        }

        .brand-info {
            text-align: right;
            min-width: 0;
        }

        .brand-info .eyebrow {
            color: #008FC7;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .brand-info h1 {
            margin: 0;
            color: #25282B;
            font-size: 25px;
            line-height: 1.15;
        }

        .brand-info p {
            margin: 5px 0 0;
            color: #6F7072;
            font-size: 13px;
        }

        .search-box {
            box-shadow: 0 1px 4px rgba(37,40,43,0.05);
        }

        .search-box:focus {
            border-color: #00A3E2;
            box-shadow: 0 0 0 3px rgba(0,163,226,0.12);
        }

        .summary-box:hover {
            border-color: #00A3E2;
        }

        .summary-box.active {
            border-color: #00A3E2;
            box-shadow: 0 2px 8px rgba(0,163,226,0.16);
        }

        .plus {
            background: #00A3E2;
            color: white;
        }

        .plus:hover {
            background: #008FC7;
        }

        .minus:hover {
            background: #DDE3E8;
        }

        .physical-input:focus {
            border-color: #00A3E2;
            box-shadow: 0 0 0 3px rgba(0,163,226,0.10);
        }

        .product {
            border: 1px solid transparent;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .product:hover {
            border-color: #E1E7EC;
            box-shadow: 0 3px 10px rgba(37,40,43,0.08);
        }

        .status.success {
            color: #138A4B;
            border-left: 4px solid #138A4B;
        }

        .status.error {
            color: #C62828;
            border-left: 4px solid #C62828;
        }

        .notes-input:focus {
            border-color: #00A3E2;
            box-shadow: 0 0 0 3px rgba(0,163,226,0.08);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 18px;
            background: #6F7072;
            color: white;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .file-label:hover {
            opacity: 0.9;
        }

        #excelFile {
            display: none;
        }

        .action-button {
            border: 0;
            height: 46px;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        #exportButton {
            min-width: 128px;
        }

        #finalizeButton {
            min-width: 150px;
        }

        .action-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .secondary-action {
            background: white;
            color: #25282B;
            border: 1px solid #d5d5d5;
        }

        .secondary-action:not(:disabled):hover {
            background: #f3f3f3;
        }

        .finalize-action {
            background: #138A4B;
            color: white;
        }

        .finalize-action:not(:disabled):hover {
            opacity: 0.9;
        }


        .file-name {
            display: flex;
            align-items: center;
            min-height: 46px;
            color: #666;
            font-size: 14px;
            flex: 0 1 auto;
            min-width: 0;
        }

        #fileName {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #saveStatus {
            max-width: 180px;
            white-space: nowrap;
        }

        #saveStatus {
            font-size: 13px;
            color: #6F7072;
        }

        .status {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: none;
        }

        .status.error {
            color: #b71c1c;
            display: block;
        }

        .status.success {
            color: #138A4B;
            display: block;
        }

        .search-box {
            width: 100%;
            padding: 15px 18px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
            background: white;
        }

        .search-box:focus {
            border-color: #00A3E2;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .summary-box {
            background: white;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 12px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            color: #25282B;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
        }

        .summary-box:hover {
            border-color: #ccc;
        }

        .summary-box:active {
            transform: scale(0.98);
        }

        .summary-box.active {
            border-color: #25282B;
            box-shadow: 0 2px 7px rgba(0,0,0,0.14);
        }

        .summary-box span {
            font-size: 13px;
            color: #6F7072;
        }

        .summary-box strong { display: block; font-size: 20px; margin-top: 3px; }

        .summary-extra {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .summary-extra .summary-box {
            cursor: default;
        }

        .notes-area { margin-top:14px; padding-top:12px; border-top:1px solid #eee; }
        .notes-label { display:block; font-size:12px; color:#777; margin-bottom:6px; }
        .notes-input { width:100%; min-height:42px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; font-family:inherit; font-size:14px; resize:vertical; outline:none; }
        .notes-input:focus { border-color:#555; }
        .history-toggle { margin-top:8px; width:auto; height:auto; padding:6px 0; background:transparent; color:#555; font-size:13px; font-weight:600; }
        .history { display:none; margin-top:8px; padding:10px 12px; background:#f7f7f7; border-radius:8px; font-size:12px; }
        .history.visible { display:block; }
        .history-item { padding:5px 0; border-bottom:1px solid #e5e5e5; }
        .history-item:last-child { border-bottom:none; }
        .history-time { color:#777; margin-right:7px; }

        .product {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .sku {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .description {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.35;
        }

        .numbers {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .number {
            text-align: center;
            min-width: 70px;
        }

        .number-label {
            display: block;
            font-size: 12px;
            color: #6F7072;
            margin-bottom: 4px;
        }

        .number-value {
            font-size: 20px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .minus {
            background: #e5e5e5;
        }

        .plus {
            background: #6F7072;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        .physical-input {
            width: 55px;
            height: 42px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .physical-input:focus {
            border-color: #00A3E2;
        }

        .difference-ok {
            color: #138A4B;
        }

        .difference-warning {
            color: #c62828;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #6F7072;
            background: white;
            border-radius: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6F7072;
            background: white;
            border-radius: 12px;
        }

        .empty-state strong {
            display: block;
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
        }


        @media (max-width: 700px) {
            .brand-header {
                padding: 16px;
                align-items: flex-start;
            }

            .brand-logo {
                width: 210px;
                max-width: 55%;
            }

            .brand-info {
                text-align: right;
            }

            .brand-info h1 {
                font-size: 20px;
            }

            .brand-info p {
                font-size: 11px;
            }
        }

        @media (max-width: 700px) {
            .summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .summary-extra {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 18px 12px;
            }

            h1 {
                font-size: 24px;
            }

            .product {
                grid-template-columns: 1fr;
            }

            .numbers {
                justify-content: space-between;
                width: 100%;
                gap: 8px;
            }

            .description {
                font-size: 15px;
            }

            .number {
                min-width: 60px;
            }
        }
    
        .filter-box {
            min-height: 72px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 4px;
            padding: 10px 16px;
        }

        .filter-box span {
            font-size: 14px;
            line-height: 1.2;
        }

        .filter-box strong {
            display: block;
            font-size: 20px;
            line-height: 1.1;
            font-weight: 600;
            margin: 0;
        }

        .summary {
            margin-bottom: 12px;
        }

        .summary-extra {
            margin-top: 0;
        }

    
        @media (max-width: 760px) {
            .top-actions {
                align-items: stretch;
            }

            #fileName,
            #saveStatus {
                min-height: 46px;
            }

            #exportButton,
            #finalizeButton {
                flex: 1 1 0;
            }
        }

    </style>
</head>

        </button>

        type="text"

            <span>Pendientes</span>

            <span>Faltantes</span>

        </button>

        <button type="button" class="summary-box filter-box" id="filterCompleted" onclick="setFilter('completed')">
            <span>Cuadrados</span>

            <strong id="physicalUnits">0</strong>

<script>

let products = [];
let currentInventoryKey = null;
let currentFilter = "all";

const STORAGE_PREFIX = "verificadorInventario_";

const productList = document.getElementById("productList");
const search = document.getElementById("search");
const excelFile = document.getElementById("excelFile");
const fileName = document.getElementById("fileName");
const status = document.getElementById("status");
const saveStatus = document.getElementById("saveStatus");
const exportButton = document.getElementById("exportButton");
const finalizeButton = document.getElementById("finalizeButton");

function isEmpty(value) {
    return value === null ||
           value === undefined ||
           String(value).trim() === "";
}

function normalizeText(value) {
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function parseNumber(value) {
    if (typeof value === "number" && Number.isFinite(value)) {
        return value;
    }

    if (isEmpty(value)) {
        return 0;
    }

    const cleaned = String(value)
        .replace(/,/g, "")
        .trim();

    const number = Number(cleaned);

    return Number.isFinite(number) ? number : 0;
}

function updateActionButtons() {

    const enabled = products.length > 0;

    if (exportButton) {
        exportButton.disabled = !enabled;
    }

    if (finalizeButton) {
        finalizeButton.disabled = !enabled;
    }
}

function showStatus(message, type) {
    status.textContent = message;
    status.className = "status " + type;
}

excelFile.addEventListener("change", handleExcel);


function createInventoryKey(file, products) {

    const signature = products
        .map(product =>
            `${product.sku}|${product.description}|${product.system}`
        )
        .join("||");

    return STORAGE_PREFIX + simpleHash(
        file.name + "|" + file.size + "|" + signature
    );
}

function simpleHash(text) {

    let hash = 0;

    for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
    }

    return Math.abs(hash).toString(36);
}

function saveInventory() {

    if (!currentInventoryKey || !products.length) {
        return;
    }

    const data = {
        fileName: fileName.textContent,
        savedAt: new Date().toISOString(),
        products: products
    };

    localStorage.setItem(
        currentInventoryKey,
        JSON.stringify(data)
    );

    updateSaveStatus();
}

function loadSavedInventory(key) {

    const saved = localStorage.getItem(key);

    if (!saved) {
        return false;
    }

    try {

        const data = JSON.parse(saved);

        if (!data.products || !Array.isArray(data.products)) {
            return false;
        }

        products = data.products.map(product => ({
            ...product,
            notes: typeof product.notes === "string" ? product.notes : "",
            history: Array.isArray(product.history) ? product.history : []
        }));

        if (data.fileName) {
            fileName.textContent = data.fileName;
        }

        updateSaveStatus(data.savedAt);

        return true;

    } catch (error) {

        return false;
    }
}

function updateSaveStatus(savedAt) {

    if (!saveStatus) return;

    const date = savedAt
        ? new Date(savedAt)
        : new Date();

    saveStatus.textContent =
        "Guardado: " +
        date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
}

function confirmSavedInventory(key) {

    const saved = localStorage.getItem(key);

    if (!saved) {
        return false;
    }

    try {

        const data = JSON.parse(saved);

        const counted = data.products.filter(product =>
            Number(product.physical) > 0
        ).length;

        const total = data.products.length;

        return confirm(
            "Hay un inventario guardado de " +
            total +
            " productos.\n\n" +
            counted +
            " productos ya tienen conteo físico.\n\n" +
            "¿Deseas continuar con este inventario?"
        );

    } catch (error) {

        return false;
    }
}

function deleteSavedInventory() {

    if (!currentInventoryKey) return;

    localStorage.removeItem(currentInventoryKey);

    saveStatus.textContent =
        "Sin cambios guardados";
}


function handleExcel(event) {

    const file = event.target.files[0];

    if (!file) return;

    fileName.textContent = file.name;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const data = new Uint8Array(e.target.result);

            const workbook = XLSX.read(data, {
                type: "array"
            });

            if (!workbook.SheetNames.length) {
                throw new Error("El archivo no contiene hojas.");
            }

            const sheet = workbook.Sheets[workbook.SheetNames[0]];

            const rows = XLSX.utils.sheet_to_json(sheet, {
                defval: null
            });

            if (!rows.length) {
                throw new Error("La hoja no contiene datos.");
            }

            const firstRow = rows[0];

            const requiredColumns = [
                "ItemCode",
                "ItemName",
                "Existencia"
            ];

            const missingColumns = requiredColumns.filter(
                column => !(column in firstRow)
            );

            if (missingColumns.length) {
                throw new Error(
                    "No se encontraron las columnas necesarias: " +
                    missingColumns.join(", ")
                );
            }

            products = rows
                .filter(row => {

                    const sku = row.ItemCode;

                    if (isEmpty(sku)) {
                        return false;
                    }

                    /*
                     * Un producto se considera SIN SERIE
                     * cuando NomSerie y NoSerie están vacíos.
                     */
                    const hasNomSerie =
                        !isEmpty(row.NomSerie);

                    const hasNoSerie =
                        !isEmpty(row.NoSerie);

                    return !hasNomSerie && !hasNoSerie;
                })
                .map(row => ({
                    sku: String(row.ItemCode).trim(),
                    description: String(row.ItemName ?? "").trim(),
                    system: parseNumber(row.Existencia),
                    physical: 0,
                    notes: "",
                    history: []
                }));

            if (!products.length) {
                throw new Error(
                    "No se encontraron productos sin serie en el archivo."
                );
            }

            currentInventoryKey =
                createInventoryKey(file, products);

            const hasSavedInventory =
                !!localStorage.getItem(currentInventoryKey);

            if (hasSavedInventory &&
                confirmSavedInventory(currentInventoryKey)) {

                loadSavedInventory(currentInventoryKey);

                showStatus(
                    "Inventario guardado recuperado correctamente.",
                    "success"
                );

            } else {

                /*
                 * Si el usuario no desea continuar con el conteo anterior,
                 * comenzamos este inventario desde cero.
                 */
                deleteSavedInventory();

                showStatus(
                    "Excel cargado correctamente. " +
                    products.length +
                    " productos sin serie encontrados.",
                    "success"
                );
            }

            search.value = "";
            currentFilter = "all";
            updateFilterButtons();
            updateActionButtons();

            renderProducts();

        } catch (error) {

            products = [];
            updateActionButtons();

            renderProducts();

            showStatus(
                "No se pudo cargar el Excel: " +
                error.message,
                "error"
            );
        }
    };

    reader.onerror = function() {

        showStatus(
            "No se pudo leer el archivo.",
            "error"
        );
    };

    reader.readAsArrayBuffer(file);
}

function exportInventory() {

    if (!products.length) {
        showStatus("No hay un inventario cargado para exportar.", "error");
        return;
    }

    const rows = products.map(product => {

        const difference =
            Number(product.physical || 0) -
            Number(product.system || 0);

        let estado = "Cuadrado";

        if (product.physical === 0 && product.system > 0) {
            estado = "Pendiente";
        } else if (
            product.physical > 0 &&
            product.physical < product.system
        ) {
            estado = "Faltante";
        } else if (product.physical > product.system) {
            estado = "Sobrante";
        }

        return {
            SKU: product.sku,
            DESCRIPCION: product.description,
            "CANTIDAD EN SISTEMA": product.system,
            "CANTIDAD FISICA": product.physical,
            DIFERENCIA: difference,
            ESTADO: estado,
            NOTAS: product.notes || ""
        };
    });

    const summaryRows = [
        ["Resumen del inventario"],
        [],
        ["Archivo", fileName.textContent],
        ["Fecha de exportación", new Date().toLocaleString()],
        [],
        ["Productos", products.length],
        ["Cuadrados", products.filter(p => p.physical === p.system).length],
        ["Pendientes", products.filter(p => p.physical === 0 && p.system > 0).length],
        ["Faltantes", products.filter(p => p.physical > 0 && p.physical < p.system).length],
        ["Sobrantes", products.filter(p => p.physical > p.system).length],
        [],
        ["Unidades sistema", products.reduce((t, p) => t + Number(p.system || 0), 0)],
        ["Unidades físicas", products.reduce((t, p) => t + Number(p.physical || 0), 0)],
        ["Diferencia total", products.reduce((t, p) => t + Number(p.physical || 0) - Number(p.system || 0), 0)]
    ];

    const workbook = XLSX.utils.book_new();

    const inventorySheet =
        XLSX.utils.json_to_sheet(rows);

    const summarySheet =
        XLSX.utils.aoa_to_sheet(summaryRows);

    XLSX.utils.book_append_sheet(
        workbook,
        inventorySheet,
        "Inventario"
    );

    XLSX.utils.book_append_sheet(
        workbook,
        summarySheet,
        "Resumen"
    );

    const baseName =
        fileName.textContent
            .replace(/\.(xlsx|xls)$/i, "")
            .replace(/[\\/:*?"<>|]/g, "_");

    const finalName =
        (baseName || "inventario") +
        "_RESULTADO.xlsx";

    XLSX.writeFile(workbook, finalName);

    showStatus(
        "Excel exportado correctamente.",
        "success"
    );
}

function finalizeInventory() {

    if (!products.length) return;

    const pending =
        products.filter(product =>
            product.physical === 0 &&
            product.system > 0
        ).length;

    const completed =
        products.filter(product =>
            product.physical === product.system
        ).length;

    const missing =
        products.filter(product =>
            product.physical > 0 &&
            product.physical < product.system
        ).length;

    const surplus =
        products.filter(product =>
            product.physical > product.system
        ).length;

    let message =
        "¿Deseas marcar este inventario como FINALIZADO?\n\n" +
        "Productos: " + products.length + "\n" +
        "Cuadrados: " + completed + "\n" +
        "Pendientes: " + pending + "\n" +
        "Faltantes: " + missing + "\n" +
        "Sobrantes: " + surplus + "\n\n" +
        "Esto no borra el autoguardado ni bloquea los cambios.";

    if (pending > 0) {
        message +=
            "\n\nTodavía hay productos pendientes de conteo.";
    }

    if (!confirm(message)) {
        return;
    }

    const finalizedAt =
        new Date().toISOString();

    localStorage.setItem(
        currentInventoryKey + "_finalizado",
        finalizedAt
    );

    saveInventory();

    showStatus(
        "Inventario finalizado el " +
        new Date(finalizedAt).toLocaleString() +
        ". Puedes exportar el resultado.",
        "success"
    );
}

function renderProducts() {

    const text = normalizeText(search.value.trim());

    const filtered = products.filter(product => {

        const matchesSearch =
            normalizeText(product.sku).includes(text) ||
            normalizeText(product.description).includes(text);

        const difference = product.physical - product.system;

        const matchesFilter =
            currentFilter === "all" ||
            (currentFilter === "pending" && product.physical === 0 && product.system > 0) ||
            (currentFilter === "missing" && product.physical > 0 && product.physical < product.system) ||
            (currentFilter === "completed" && difference === 0);

        return matchesSearch && matchesFilter;
    });

    productList.innerHTML = "";

    if (!products.length) {

        productList.innerHTML = `
            <div class="empty-state">
                <strong>Carga tu archivo Excel</strong>
                Selecciona el inventario para comenzar.
            </div>
        `;

        updateSummary();

        return;
    }

    if (filtered.length === 0) {

        productList.innerHTML = `
            <div class="no-results">
                No se encontraron productos.
            </div>
        `;

        updateSummary();

        return;
    }

    filtered.forEach(product => {

        const difference = product.physical - product.system;

        const differenceClass =
            difference === 0
                ? "difference-ok"
                : "difference-warning";

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `
            <div>
                <div class="sku">
                    ${escapeHtml(product.sku)}
                </div>

                <div class="description">
                    ${escapeHtml(product.description)}
                </div>
            </div>

            <div class="numbers">

                <div class="number">
                    <span class="number-label">
                        Sistema
                    </span>

                    <span class="number-value">
                        ${product.system}
                    </span>
                </div>

                <div class="number">

                    <span class="number-label">
                        Físico
                    </span>

                    <div class="controls">

                        <button
                            class="minus"
                            onclick="changePhysical('${escapeAttribute(product.sku)}', -1)"
                            aria-label="Disminuir"
                        >
                            −
                        </button>

                        <input
                            type="number"
                            class="physical-input"
                            value="${product.physical}"
                            min="0"
                            step="1"
                            onchange="setPhysical('${escapeAttribute(product.sku)}', this.value)"
                        >

                        <button
                            class="plus"
                            onclick="changePhysical('${escapeAttribute(product.sku)}', 1)"
                            aria-label="Aumentar"
                        >
                            +
                        </button>

                    </div>
                </div>

                <div class="number">

                    <span class="number-label">
                        Diferencia
                    </span>

                    <span class="number-value ${differenceClass}">
                        ${difference}
                    </span>

                </div>

            </div>

            <div class="notes-area">
                <label class="notes-label">Notas</label>
                <textarea class="notes-input" placeholder="Ej.: Exhibición, uso interno, prestado..." onchange="setNotes('${escapeAttribute(product.sku)}', this.value)">${escapeHtml(product.notes || "")}</textarea>
                <button type="button" class="history-toggle" onclick="toggleHistory(this)">Historial (${Math.min(product.history.length, 5)})</button>
                <div class="history">${renderHistory(product)}</div>
            </div>
        `;

        productList.appendChild(div);
    });

    updateSummary();
}

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

function addHistory(product, action, oldValue, newValue) {
    if (!Array.isArray(product.history)) product.history = [];
    product.history.push({ time:new Date().toISOString(), action, oldValue:String(oldValue), newValue:String(newValue) });
    if (product.history.length > 5) product.history = product.history.slice(-5);
}

function renderHistory(product) {
    if (!product.history || !product.history.length) return '<div class="history-item">Sin modificaciones registradas.</div>';
    return product.history.slice().reverse().map(item => {
        const time = new Date(item.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        return `<div class="history-item"><span class="history-time">${time}</span><strong>${escapeHtml(item.action)}</strong> ${escapeHtml(item.oldValue)} → ${escapeHtml(item.newValue)}</div>`;
    }).join('');
}

function toggleHistory(button) {
    const history = button.nextElementSibling;
    if (!history) return;
    history.classList.toggle('visible');
    button.textContent = history.classList.contains('visible') ? 'Ocultar historial' : `Historial (${Math.min((products.find(p => p.sku === button.closest('.product').querySelector('.sku').textContent)?.history || []).length,5)})`;
}

function setNotes(sku, value) {
    const product = products.find(p => p.sku === sku);
    if (!product) return;
    const oldValue = product.notes || '';
    const newValue = String(value || '').trim();
    if (oldValue === newValue) return;
    product.notes = newValue;
    addHistory(product, 'Nota', oldValue || '""', newValue || '""');
    saveInventory();
    renderProducts();
}

function changePhysical(sku, amount) {

    const product =
        products.find(p => p.sku === sku);

    if (!product) return;

    const oldValue = product.physical;
    product.physical += amount;
    if (product.physical < 0) product.physical = 0;
    if (oldValue !== product.physical) addHistory(product, 'Físico', oldValue, product.physical);
    saveInventory();
    renderProducts();
}

function setPhysical(sku, value) {

    const product =
        products.find(p => p.sku === sku);

    if (!product) return;

    let quantity =
        parseInt(value, 10);

    if (isNaN(quantity) || quantity < 0) {
        quantity = 0;
    }

    const oldValue = product.physical;
    product.physical = quantity;
    if (oldValue !== product.physical) addHistory(product, 'Físico', oldValue, product.physical);
    saveInventory();
    renderProducts();
}

function setFilter(filter) {

    currentFilter = filter;

    updateFilterButtons();
    renderProducts();
}

function updateFilterButtons() {

    const buttons = {
        all: document.getElementById("filterAll"),
        completed: document.getElementById("filterCompleted"),
        pending: document.getElementById("filterPending"),
        missing: document.getElementById("filterMissing")
    };

    Object.values(buttons).forEach(button => {
        if (button) {
            button.classList.remove("active");
        }
    });

    if (buttons[currentFilter]) {
        buttons[currentFilter].classList.add("active");
    }
}

function updateSummary() {

    document.getElementById("totalProducts").textContent =
        products.length;

    const completed =
        products.filter(product =>
            product.system === product.physical
        ).length;

    const pending =
        products.filter(product =>
            product.physical === 0 && product.system > 0
        ).length;

    const missing =
        products.filter(product =>
            product.physical > 0 &&
            product.physical < product.system
        ).length;

    document.getElementById("completedProducts").textContent =
        completed;

    document.getElementById("pendingProducts").textContent =
        pending;

    document.getElementById("missingProducts").textContent =
        missing;

    const systemUnits =
        products.reduce(
            (total, product) => total + Number(product.system || 0),
            0
        );

    const physicalUnits =
        products.reduce(
            (total, product) => total + Number(product.physical || 0),
            0
        );

    document.getElementById("systemUnits").textContent =
        systemUnits;

    document.getElementById("physicalUnits").textContent =
        physicalUnits;

    document.getElementById("totalDifference").textContent =
        systemUnits - physicalUnits;

    updateFilterButtons();
}

search.addEventListener("input", renderProducts);

updateSummary();
updateActionButtons();

</script>

</body>
</html>
