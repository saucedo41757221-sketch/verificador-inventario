<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Inventario</title>

    <!-- Librería para leer archivos Excel directamente en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 18px;
            background: #222;
            color: white;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .file-label:hover {
            opacity: 0.9;
        }

        #excelFile {
            display: none;
        }

        .file-name {
            display: flex;
            align-items: center;
            min-height: 46px;
            color: #666;
            font-size: 14px;
        }

        #saveStatus {
            font-size: 13px;
            color: #777;
        }

        .status {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: none;
        }

        .status.error {
            color: #b71c1c;
            display: block;
        }

        .status.success {
            color: #16803c;
            display: block;
        }

        .search-box {
            width: 100%;
            padding: 15px 18px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
            background: white;
        }

        .search-box:focus {
            border-color: #555;
        }

        .summary {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .summary-box {
            background: white;
            border-radius: 10px;
            padding: 12px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            min-width: 120px;
        }

        .summary-box span {
            font-size: 13px;
            color: #777;
        }

        .summary-box strong {
            display: block;
            font-size: 20px;
            margin-top: 3px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .sku {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .description {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.35;
        }

        .numbers {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .number {
            text-align: center;
            min-width: 70px;
        }

        .number-label {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 4px;
        }

        .number-value {
            font-size: 20px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .minus {
            background: #e5e5e5;
        }

        .plus {
            background: #222;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        .physical-input {
            width: 55px;
            height: 42px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .physical-input:focus {
            border-color: #555;
        }

        .difference-ok {
            color: #16803c;
        }

        .difference-warning {
            color: #c62828;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #777;
            background: white;
            border-radius: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #777;
            background: white;
            border-radius: 12px;
        }

        .empty-state strong {
            display: block;
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 18px 12px;
            }

            h1 {
                font-size: 24px;
            }

            .product {
                grid-template-columns: 1fr;
            }

            .numbers {
                justify-content: space-between;
                width: 100%;
                gap: 8px;
            }

            .description {
                font-size: 15px;
            }

            .number {
                min-width: 60px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Inventario físico</h1>

    <div class="top-actions">
        <label class="file-label" for="excelFile">
            Cargar Excel
        </label>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <div class="file-name" id="fileName">
            Ningún archivo cargado
        </div>

        <div class="file-name" id="saveStatus">
            Sin cambios guardados
        </div>
    </div>

    <div id="status" class="status"></div>

    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Buscar por SKU o descripción..."
        autocomplete="off"
    >

    <div class="summary">
        <div class="summary-box">
            <span>Productos</span>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="summary-box">
            <span>Cuadrados</span>
            <strong id="completedProducts">0</strong>
        </div>

        <div class="summary-box">
            <span>Pendientes</span>
            <strong id="pendingProducts">0</strong>
        </div>
    </div>

    <div id="productList">
        <div class="empty-state">
            <strong>Carga tu archivo Excel</strong>
            Selecciona el inventario para comenzar.
        </div>
    </div>

</div>

<script>

let products = [];
let currentInventoryKey = null;

const STORAGE_PREFIX = "verificadorInventario_";

const productList = document.getElementById("productList");
const search = document.getElementById("search");
const excelFile = document.getElementById("excelFile");
const fileName = document.getElementById("fileName");
const status = document.getElementById("status");
const saveStatus = document.getElementById("saveStatus");

function isEmpty(value) {
    return value === null ||
           value === undefined ||
           String(value).trim() === "";
}

function normalizeText(value) {
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function parseNumber(value) {
    if (typeof value === "number" && Number.isFinite(value)) {
        return value;
    }

    if (isEmpty(value)) {
        return 0;
    }

    const cleaned = String(value)
        .replace(/,/g, "")
        .trim();

    const number = Number(cleaned);

    return Number.isFinite(number) ? number : 0;
}

function showStatus(message, type) {
    status.textContent = message;
    status.className = "status " + type;
}

excelFile.addEventListener("change", handleExcel);

function handleExcel(event) {

    const file = event.target.files[0];

    if (!file) return;

    fileName.textContent = file.name;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const data = new Uint8Array(e.target.result);

            const workbook = XLSX.read(data, {
                type: "array"
            });

            if (!workbook.SheetNames.length) {
                throw new Error("El archivo no contiene hojas.");
            }

            const sheet = workbook.Sheets[workbook.SheetNames[0]];

            const rows = XLSX.utils.sheet_to_json(sheet, {
                defval: null
            });

            if (!rows.length) {
                throw new Error("La hoja no contiene datos.");
            }

            const firstRow = rows[0];

            const requiredColumns = [
                "ItemCode",
                "ItemName",
                "Existencia"
            ];

            const missingColumns = requiredColumns.filter(
                column => !(column in firstRow)
            );

            if (missingColumns.length) {
                throw new Error(
                    "No se encontraron las columnas necesarias: " +
                    missingColumns.join(", ")
                );
            }

            products = rows
                .filter(row => {

                    const sku = row.ItemCode;

                    if (isEmpty(sku)) {
                        return false;
                    }

                    /*
                     * Un producto se considera SIN SERIE
                     * cuando NomSerie y NoSerie están vacíos.
                     */
                    const hasNomSerie =
                        !isEmpty(row.NomSerie);

                    const hasNoSerie =
                        !isEmpty(row.NoSerie);

                    return !hasNomSerie && !hasNoSerie;
                })
                .map(row => ({
                    sku: String(row.ItemCode).trim(),
                    description: String(row.ItemName ?? "").trim(),
                    system: parseNumber(row.Existencia),
                    physical: 0
                }));

            if (!products.length) {
                throw new Error(
                    "No se encontraron productos sin serie en el archivo."
                );
            }

            currentInventoryKey =
                createInventoryKey(file, products);

            const hasSavedInventory =
                !!localStorage.getItem(currentInventoryKey);

            if (hasSavedInventory &&
                confirmSavedInventory(currentInventoryKey)) {

                loadSavedInventory(currentInventoryKey);

                showStatus(
                    "Inventario guardado recuperado correctamente.",
                    "success"
                );

            } else {

                /*
                 * Si el usuario no desea continuar con el conteo anterior,
                 * comenzamos este inventario desde cero.
                 */
                deleteSavedInventory();

                showStatus(
                    "Excel cargado correctamente. " +
                    products.length +
                    " productos sin serie encontrados.",
                    "success"
                );
            }

            search.value = "";

            renderProducts();

        } catch (error) {

            products = [];

            renderProducts();

            showStatus(
                "No se pudo cargar el Excel: " +
                error.message,
                "error"
            );
        }
    };

    reader.onerror = function() {

        showStatus(
            "No se pudo leer el archivo.",
            "error"
        );
    };

    reader.readAsArrayBuffer(file);
}

function renderProducts() {

    const text = normalizeText(search.value.trim());

    const filtered = products.filter(product =>
        normalizeText(product.sku).includes(text) ||
        normalizeText(product.description).includes(text)
    );

    productList.innerHTML = "";

    if (!products.length) {

        productList.innerHTML = `
            <div class="empty-state">
                <strong>Carga tu archivo Excel</strong>
                Selecciona el inventario para comenzar.
            </div>
        `;

        updateSummary();

        return;
    }

    if (filtered.length === 0) {

        productList.innerHTML = `
            <div class="no-results">
                No se encontraron productos.
            </div>
        `;

        updateSummary();

        return;
    }

    filtered.forEach(product => {

        const difference =
            product.system - product.physical;

        const differenceClass =
            difference === 0
                ? "difference-ok"
                : "difference-warning";

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `
            <div>
                <div class="sku">
                    ${escapeHtml(product.sku)}
                </div>

                <div class="description">
                    ${escapeHtml(product.description)}
                </div>
            </div>

            <div class="numbers">

                <div class="number">
                    <span class="number-label">
                        Sistema
                    </span>

                    <span class="number-value">
                        ${product.system}
                    </span>
                </div>

                <div class="number">

                    <span class="number-label">
                        Físico
                    </span>

                    <div class="controls">

                        <button
                            class="minus"
                            onclick="changePhysical('${escapeAttribute(product.sku)}', -1)"
                            aria-label="Disminuir"
                        >
                            −
                        </button>

                        <input
                            type="number"
                            class="physical-input"
                            value="${product.physical}"
                            min="0"
                            step="1"
                            onchange="setPhysical('${escapeAttribute(product.sku)}', this.value)"
                        >

                        <button
                            class="plus"
                            onclick="changePhysical('${escapeAttribute(product.sku)}', 1)"
                            aria-label="Aumentar"
                        >
                            +
                        </button>

                    </div>
                </div>

                <div class="number">

                    <span class="number-label">
                        Diferencia
                    </span>

                    <span class="number-value ${differenceClass}">
                        ${difference}
                    </span>

                </div>

            </div>
        `;

        productList.appendChild(div);
    });

    updateSummary();
}

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

function changePhysical(sku, amount) {

    const product =
        products.find(p => p.sku === sku);

    if (!product) return;

    product.physical += amount;

    if (product.physical < 0) {
        product.physical = 0;
    }

    saveInventory();
    renderProducts();
}

function setPhysical(sku, value) {

    const product =
        products.find(p => p.sku === sku);

    if (!product) return;

    let quantity =
        parseInt(value, 10);

    if (isNaN(quantity) || quantity < 0) {
        quantity = 0;
    }

    product.physical = quantity;

    saveInventory();
    renderProducts();
}

function updateSummary() {

    document.getElementById("totalProducts").textContent =
        products.length;

    const completed =
        products.filter(product =>
            product.system === product.physical
        ).length;

    document.getElementById("completedProducts").textContent =
        completed;

    document.getElementById("pendingProducts").textContent =
        products.length - completed;
}

search.addEventListener("input", renderProducts);

updateSummary();

</script>

</body>
</html>
